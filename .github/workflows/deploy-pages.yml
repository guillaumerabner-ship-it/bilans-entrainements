name: Publier l'application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Préparer les fichiers publics
        run: |
          mkdir public
          cp index.html styles.css app.js sync-priority.js manifest.webmanifest service-worker.js public/
          cp -R icons public/icons

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l’archive du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
